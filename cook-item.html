<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saviour - Start Cooking</title>
  <meta name="description" content="View ingredients and start cooking your selected meal with Saviour.">
  <link rel="stylesheet" href="global.css">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body>

  <!-- Responsive App Container fitting viewport height -->
  <div class="app-container c-cook-item" id="app-container" data-page="cook-item">
    
    <!-- 1. Dynamic iPhone Status Bar Component -->
    <header data-component="status-bar" id="app-status-bar"></header>

    <!-- 2. Back Chevron Link (Absolute positioned) -->
    <a href="index.html" class="c-cook-back" id="cook-back-btn" aria-label="Go back to meals list">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12.5 15L7.5 10L12.5 5" stroke="var(--color-text-secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

    <!-- 3. Top Section with Info (Absolute positioned matching Figma spacing) -->
    <div class="c-cook-top-section">
      <!-- Centered food emoji container -->
      <div class="CenteredFoodEmojiContainerMargin" style="width: 120px; flex-direction: column; justify-content: flex-start; align-items: flex-start; display: flex">
        <div class="c-emoji-circle" id="cook-meal-emoji">🍛</div>
      </div>
      
      <!-- Info stack -->
      <div class="c-cook-info-stack">
        <div class="Heading1MealNameTimeDetailsMargin" style="width: 149.15px; height: 35.60px; position: relative">
          <div class="Heading1MealNameTimeDetails" style="left: 0px; top: -0.60px; position: absolute; flex-direction: column; justify-content: flex-start; align-items: center; display: inline-flex">
            <h1 class="c-cook-title" id="cook-meal-title">Rajma Rice</h1>
          </div>
        </div>
        
        <!-- Meta details -->
        <div class="c-cook-meta">
          <div style="display: flex; align-items: center; gap: 4px;">
            <!-- SVG clock -->
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M8.00065 3.99992V7.99992L10.6673 9.33325M14.6673 7.99992C14.6673 11.6818 11.6825 14.6666 8.00065 14.6666C4.31875 14.6666 1.33398 11.6818 1.33398 7.99992C1.33398 4.31802 4.31875 1.33325 8.00065 1.33325C11.6825 1.33325 14.6673 4.31802 14.6673 7.99992Z" stroke="var(--color-text-secondary)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span style="font-size: 14px; font-family: 'DM Sans', sans-serif; font-weight: 400; line-height: 22.40px;">35 min</span>
          </div>
          <div class="c-cook-meta__dot"></div>
          <span class="c-cook-meta__tag">For one person</span>
        </div>
        
        <!-- Status success message -->
        <div class="c-cook-status">Everything is at home</div>
      </div>

      <!-- Ingredients Drawer -->
      <div class="c-cook-ingredients-drawer">
        <button class="c-cook-drawer-trigger" id="ingredients-drawer-btn">
          <span id="ingredients-drawer-text">Show ingredients</span>
          <span id="ingredients-drawer-arrow">↓</span>
        </button>
        
        <!-- Collapsible Card -->
        <div class="c-cook-drawer-card" id="ingredients-drawer-card">
          <div class="c-cook-row">
            <span class="c-cook-row__name">Red kidney beans (rajma)</span>
            <span class="c-cook-row__qty">1 cup</span>
          </div>
          <div class="c-cook-row">
            <span class="c-cook-row__name">Basmati rice</span>
            <span class="c-cook-row__qty">1 cup</span>
          </div>
          <div class="c-cook-row">
            <span class="c-cook-row__name">Onion & tomato</span>
            <span class="c-cook-row__qty">1 large</span>
          </div>
          <div class="c-cook-row">
            <span class="c-cook-row__name">Ginger-garlic paste</span>
            <span class="c-cook-row__qty">1 tbsp</span>
          </div>
          <div class="c-cook-row">
            <span class="c-cook-row__name">Spices (garam masala)</span>
            <span class="c-cook-row__qty">1 tsp</span>
          </div>
          
          <!-- Staples note -->
          <div class="c-cook-drawer-note">
            Salt, oil, jeera, hing assumed at home.
          </div>
        </div>
      </div>
    </div>

    <!-- 4. Absolute positioned Controls Area -->
    <footer class="c-cook-controls-area" id="app-footer">
      <button class="c-btn c-btn--primary" id="start-cooking-btn">Start Cooking</button>
      <button class="c-btn c-btn--outlined" id="not-tonight-btn">Not Tonight</button>
      
      <!-- Reusable Home Indicator Component Placeholder -->
      <div data-component="home-indicator" id="app-home-indicator"></div>
    </footer>

  </div>

  <!-- Standard non-module script link for offline CORS resilience -->
  <script src="global.js"></script>
</body>
</html>
