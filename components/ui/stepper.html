<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stepper Component - Saviour UI</title>
  <link rel="stylesheet" href="../../global.css">
  <style>
    body {
      padding: 40px;
    }
    .showcase-container {
      display: flex;
      flex-direction: column;
      gap: 32px;
      max-width: 600px;
      margin: 0 auto;
    }
    .showcase-section {
      background: var(--color-surface);
      padding: 24px;
      border-radius: var(--radius-xl);
      border: 1px solid rgba(46, 42, 36, 0.06);
    }

    /* ==========================================================================
       STEPPER COMPONENT STYLES
       ========================================================================== */
    .c-stepper {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .c-stepper__btn {
      width: 32px;
      height: 32px;
      background-color: var(--color-surface); /* #F0E9DE */
      border-radius: var(--radius-sm); /* 8px */
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--color-text-secondary); /* #8C7E6A */
      font-family: var(--font-display); /* Fraunces */
      font-size: var(--font-size-subheading); /* 16px */
      font-weight: var(--font-weight-regular); /* 400 */
      line-height: var(--line-height-subheading); /* 24px */
      border: none;
      cursor: pointer;
      transition: var(--transition-smooth);
    }
    .c-stepper__btn:hover {
      background-color: var(--color-surface-raised);
    }
    .c-stepper__val {
      color: var(--color-text-primary); /* #2E2A24 */
      font-family: var(--font-interface); /* DM Sans */
      font-size: var(--font-size-body); /* 14px */
      font-weight: var(--font-weight-regular); /* 400 */
      line-height: var(--line-height-body); /* 22.40px */
      min-width: 12px;
      text-align: center;
      user-select: none;
    }
  </style>
</head>
<body>

  <div class="showcase-container">
    <h1 class="ty-display">Stepper Control</h1>
    <p class="ty-body">Steppers let users increase or decrease numeric values incrementally.</p>

    <div class="showcase-section">
      <div class="c-stepper">
        <button class="c-stepper__btn">−</button>
        <span class="c-stepper__val">1</span>
        <button class="c-stepper__btn">+</button>
      </div>
    </div>
  </div>

</body>
</html>
