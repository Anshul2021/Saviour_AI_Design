<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saviour - Notifications</title>
  <meta name="description" content="Review your dinner suggestions, energy level checks, and grocery refill notifications.">
  <link rel="stylesheet" href="global.css">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
</head>

<body>

  <!-- Responsive App Container fitting viewport height -->
  <div class="app-container" id="app-container" data-page="notifications" style="background-color: var(--color-base);">
    
    <!-- Sticky Top Header (Beige Background) -->
    <div style="background-color: var(--color-base); z-index: 10; position: relative;">
      <!-- 1. Dynamic iPhone Status Bar Component -->
      <header data-component="status-bar" id="app-status-bar"></header>
      
      <!-- Brand Header with Back Button -->
      <div style="display: flex; align-items: center; gap: 12px; padding: 8px 20px 20px;">
        <a href="home.html" style="color: var(--color-text-primary); display: flex; align-items: center; justify-content: center; text-decoration: none;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <h1 class="ty-display text-primary" style="font-family: var(--font-display); font-size: 20px; font-weight: var(--font-weight-regular); letter-spacing: 0.5px; margin: 0; line-height: 1.2;">Notifications</h1>
      </div>
    </div>

    <!-- 2. Scrollable Body Content (White Background) -->
    <main class="app-content" style="background-color: #FFFFFF; padding: 0px 20px 24px; flex: 1; overflow-y: auto; display: flex; flex-direction: column;">

      <!-- Notifications List Container -->
      <div id="notifications-list-container" class="c-notifications-list" style="display: flex; flex-direction: column; gap: 8px;">
        <!-- Dynamically injected via global.js -->
      </div>

      <!-- Empty State Container (Hidden by default) -->
      <div id="notifications-empty-state" class="c-notifications-empty" style="display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 64px 24px; gap: 16px;">
        <div class="c-notifications-empty__icon" style="width: 80px; height: 80px; background-color: var(--color-surface); color: var(--color-text-ghost); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 8px;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 8A6 6 0 0 0 6 8C6 12 4 14 4 14H20C20 14 18 12 18 8Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M13.73 21A2 2 0 0 1 10.27 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h3 class="ty-heading text-primary c-notifications-empty__title" style="margin-bottom: 4px;">All caught up!</h3>
        <p class="ty-body text-secondary" style="margin-bottom: 8px;">You don't have any notifications right now.</p>
        <a href="home.html" class="c-btn c-btn--outlined" style="height: 48px; border-radius: var(--radius-round); border: 1px solid var(--color-divider); padding: 0 24px; display: inline-flex; align-items: center; justify-content: center; color: var(--color-text-secondary); font-size: var(--font-size-body); font-weight: var(--font-weight-regular); background: transparent; transition: var(--transition-smooth); text-decoration: none;">Back to Home</a>
      </div>

    </main>

    <!-- Home Indicator -->
    <div data-component="home-indicator" id="app-home-indicator"></div>
  </div>

  <!-- Standard script link -->
  <script src="global.js?v=2"></script>
</body>

</html>
