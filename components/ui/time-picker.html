<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Picker Component - Saviour UI</title>
  <link rel="stylesheet" href="../../global.css">
  <!-- MANUAL IMPORT: Inter font is used specifically for the picker values -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      padding: 40px;
    }
    .showcase-container {
      display: flex;
      flex-direction: column;
      gap: 32px;
      max-width: 600px;
      margin: 0 auto;
    }
    .showcase-section {
      background: var(--color-surface);
      padding: 24px;
      border-radius: var(--radius-xl);
      border: 1px solid rgba(46, 42, 36, 0.06);
      display: flex;
      justify-content: center;
    }

    /* ==========================================================================
       TIME PICKER COMPONENT STYLES
       ========================================================================== */
    .c-time-picker {
      width: 375px;
      height: 430px;
      position: relative;
      background-color: var(--color-base); /* #FAF7F2 */
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0px 8px 32px rgba(46, 42, 36, 0.08);
      border: 1px solid rgba(46, 42, 36, 0.04);
    }

    /* Highlight Highlight Bar */
    .c-time-picker__highlight {
      width: 320px;
      height: 62px;
      position: absolute;
      left: 27.5px;
      top: 184px;
      background-color: var(--color-surface); /* #F0E9DE */
      border-radius: var(--radius-xl); /* 16px */
      z-index: 1;
    }

    /* Scroll Columns */
    .c-time-picker__columns {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      display: flex;
      z-index: 2;
    }

    .c-time-picker__col {
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: scroll;
      -ms-overflow-style: none;
      scrollbar-width: none;
      height: 100%;
      font-family: 'Inter', sans-serif; /* MANUAL FONT: picker wheels use Inter */
      font-weight: 400;
    }
    .c-time-picker__col::-webkit-scrollbar {
      display: none;
    }

    /* Column Positioning (Widths and offsets only, paddings and gaps inherit from global.css) */
    .c-time-picker__col--hour {
      width: 120px;
      padding-left: 30px;
    }
    
    .c-time-picker__col--minute {
      width: 140px;
    }
    
    .c-time-picker__col--period {
      width: 115px;
      padding-right: 30px;
    }

    /* Item Styles & Transparency Scaling */
    .c-time-picker__item {
      text-align: center;
      user-select: none;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Gradient Overlays for realistic 3D cylinder wheel effect */
    .c-time-picker__gradient-top {
      width: 100%;
      height: 120px;
      position: absolute;
      left: 0;
      top: 0;
      /* MANUAL COLOR: Gradient uses #F5F1EA shade for smooth blending with background */
      background: linear-gradient(180deg, rgba(245, 241, 234, 0.40) 0%, rgba(245, 241, 234, 0) 100%);
      pointer-events: none;
      z-index: 3;
    }

    .c-time-picker__gradient-bottom {
      width: 100%;
      height: 120px;
      position: absolute;
      left: 0;
      bottom: 0;
      background: linear-gradient(180deg, rgba(245, 241, 234, 0) 0%, var(--color-base) 100%);
      pointer-events: none;
      z-index: 3;
    }
  </style>
</head>
<body>

  <div class="showcase-container" id="app-container" data-page="leave-office">
    <h1 class="ty-display">Time Picker</h1>
    <p class="ty-body">iOS-style wheel picker for selecting hours, minutes, and periods (AM/PM) with smooth gradient fade masks.</p>

    <div class="showcase-section">
      <div class="c-time-picker">
        <!-- Highlight bar behind the text -->
        <div class="c-time-picker__highlight"></div>

        <!-- Wheel values -->
        <div class="c-time-picker__columns">
          <!-- Hour Column -->
          <div class="c-time-picker__col c-time-picker__col--hour" id="picker-hours">
            <!-- Populated via JavaScript -->
          </div>

          <!-- Minute Column -->
          <div class="c-time-picker__col c-time-picker__col--minute" id="picker-minutes">
            <!-- Populated via JavaScript -->
          </div>

          <!-- Period Column -->
          <div class="c-time-picker__col c-time-picker__col--period" id="picker-period">
            <!-- Populated via JavaScript -->
          </div>
        </div>

        <!-- Cylindrical shade overlays -->
        <div class="c-time-picker__gradient-top"></div>
        <div class="c-time-picker__gradient-bottom"></div>
      </div>
    </div>
  </div>

  <!-- Standard non-module script links for offline CORS resilience -->
  <script src="../../time-picker-audio.js?v=6"></script>
  <script src="../../global.js?v=6"></script>
</body>
</html>
