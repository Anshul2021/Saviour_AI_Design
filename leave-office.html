<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saviour Onboarding - Leave Office Time</title>
  <meta name="description"
    content="Select the time you usually leave the office to schedule your dinner decision checks.">
  <link rel="stylesheet" href="global.css">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Dynamic Time Picker font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
</head>

<body>

  <!-- Responsive App Container fitting viewport height -->
  <div class="app-container" id="app-container" data-page="leave-office">
    <!-- Glow Backdrop -->
    <div class="ambient-glow"></div>

    <!-- 1. Dynamic iPhone Status Bar Component -->
    <header data-component="status-bar" id="app-status-bar"></header>

    <!-- 2. Scrollable Body Content -->
    <main class="app-content app-content--leave-office">

      <!-- Header Area -->
      <div class="onboarding-header">

        <!-- H1 Title -->
        <h1 class="ty-display">When do you leave office?</h1>
        <!-- Description -->
        <p class="ty-body text-secondary">Set your usual office leaving time</p>
      </div>

      <!-- iOS-style Time Picker Wheel -->
      <div class="c-time-picker">
        <!-- Highlight bar behind the text -->
        <div class="c-time-picker__highlight"></div>

        <!-- Wheel columns -->
        <div class="c-time-picker__columns">
          <!-- Hour Column -->
          <div class="c-time-picker__col c-time-picker__col--hour" id="picker-hours">
            <!-- Populated via JavaScript -->
          </div>

          <!-- Minute Column -->
          <div class="c-time-picker__col c-time-picker__col--minute" id="picker-minutes">
            <!-- Populated via JavaScript -->
          </div>

          <!-- Period Column (AM/PM) -->
          <div class="c-time-picker__col c-time-picker__col--period" id="picker-period">
            <!-- Populated via JavaScript -->
          </div>
        </div>

        <!-- Cylindrical shade overlays -->
        <div class="c-time-picker__gradient-top"></div>
        <div class="c-time-picker__gradient-bottom"></div>
      </div>

    </main>

    <!-- 3. Fixed Bottom Controls Area with dynamic iOS Home Indicator -->
    <footer class="controls-area" id="app-footer">
      <div class="controls-area__actions">
        <!-- Circular Back Button -->
        <a href="pantry.html" class="c-btn--back" id="back-btn" aria-label="Go back">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 12H5M12 19L5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <!-- Primary Action CTA Button -->
        <button class="controls-area__btn" id="next-btn">
          <span>Let's Go...!</span>
          <!-- Arrow right SVG -->
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3.75 9H14.25M9 14.25L14.25 9L9 3.75" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </button>
      </div>

      <!-- Reusable Home Indicator Component Placeholder -->
      <div data-component="home-indicator" id="app-home-indicator"></div>
    </footer>
  </div>

  <!-- Standard non-module script links for offline CORS resilience -->
  <script src="time-picker-audio.js?v=6"></script>
  <script src="global.js?v=6"></script>
</body>

</html>
