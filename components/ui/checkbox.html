<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkbox Component - Saviour UI</title>
  <link rel="stylesheet" href="../../global.css">
  <style>
    body {
      padding: 40px;
    }
    .showcase-container {
      display: flex;
      flex-direction: column;
      gap: 32px;
      max-width: 600px;
      margin: 0 auto;
    }
    .showcase-section {
      background: var(--color-surface);
      padding: 24px;
      border-radius: var(--radius-xl);
      border: 1px solid rgba(46, 42, 36, 0.06);
      display: flex;
      gap: 32px;
    }
    .state-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .state-label {
      font-size: 11px;
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ==========================================================================
       CHECKBOX COMPONENT STYLES
       ========================================================================== */
    .c-checkbox {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: var(--transition-smooth);
      border: 1px solid var(--color-text-ghost); /* #C4B5A5 */
      background-color: var(--color-base); /* #FAF7F2 */
      outline-offset: -1px;
    }

    /* Selected State */
    .c-checkbox.is-selected {
      background-color: var(--color-text-primary); /* #2E2A24 */
      border-color: var(--color-text-primary); /* #2E2A24 */
      outline: 1px var(--color-text-primary) solid;
    }

    /* SVG Icon Inside */
    .c-checkbox svg {
      width: 14px;
      height: 14px;
      opacity: 0;
      transition: var(--transition-smooth);
    }
    .c-checkbox.is-selected svg {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="showcase-container">
    <h1 class="ty-display">Checkbox</h1>
    <p class="ty-body">Checkboxes are used to select one or more items from a list or to toggle a setting.</p>

    <div class="showcase-section">
      <!-- State: Unselected -->
      <div class="state-container">
        <span class="state-label">Selected=false</span>
        <div class="c-checkbox" id="chk1">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M11.6663 3.5L5.24967 9.91667L2.33301 7" stroke="white" stroke-width="1.45833" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <!-- State: Selected -->
      <div class="state-container">
        <span class="state-label">Selected=true</span>
        <div class="c-checkbox is-selected" id="chk2">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M11.6663 3.5L5.24967 9.91667L2.33301 7" stroke="white" stroke-width="1.45833" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <!-- State: Interactive Demo -->
      <div class="state-container">
        <span class="state-label">Interactive Demo</span>
        <div class="c-checkbox" id="chk-interactive">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M11.6663 3.5L5.24967 9.91667L2.33301 7" stroke="white" stroke-width="1.45833" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('chk-interactive').addEventListener('click', function() {
      this.classList.toggle('is-selected');
    });
  </script>
</body>
</html>
