<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantity Chip Component - Saviour UI</title>
  <link rel="stylesheet" href="../../global.css">
  <style>
    body {
      padding: 40px;
    }
    .showcase-container {
      display: flex;
      flex-direction: column;
      gap: 32px;
      max-width: 600px;
      margin: 0 auto;
    }
    .showcase-section {
      background: var(--color-surface);
      padding: 24px;
      border-radius: var(--radius-xl);
      border: 1px solid rgba(46, 42, 36, 0.06);
    }

    /* ==========================================================================
       QUANTITY CHIP COMPONENT STYLES
       ========================================================================== */
    .c-qty-chip {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      padding: 4px 10px;
      background-color: var(--color-surface); /* #F0E9DE */
      border-radius: var(--radius-lg); /* 12px */
      color: var(--color-text-primary); /* #2E2A24 */
      font-family: var(--font-interface);
      font-size: var(--font-size-body); /* 14px */
      font-weight: var(--font-weight-regular); /* 400 */
      line-height: var(--line-height-body); /* 22.4px */
    }
  </style>
</head>
<body>

  <div class="showcase-container">
    <h1 class="ty-display">Quantity Chip</h1>
    <p class="ty-body">Chips are used to display small pieces of discrete information like measurements, units, or categories.</p>

    <div class="showcase-section">
      <div class="c-qty-chip">1kg</div>
    </div>
  </div>

</body>
</html>
