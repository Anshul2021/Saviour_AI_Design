<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tonight — Calm Cooking for Tired Minds</title>
  <meta name="description" content="A warm, quiet cooking companion that does the thinking for you when you are exhausted.">
  <link rel="stylesheet" href="styles.css">
  <!-- Lucide outline-only icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- Physical phone mockup frame container (centers the mobile experience on desktop) -->
  <div class="phone-viewport">
    <div class="phone-notch"></div>
    
    <div class="screen-container">
      
      <!-- Onboarding state: Meal Selector -->
      <div id="onboarding-view" class="view-state fade-in">
        <!-- Headline & Description -->
        <h1 class="text-heading">Let's start with what you already know.</h1>
        <div class="spacer-xs"></div>
        <p class="text-body-secondary">Pick meals you already cook. No new recipes. Just your real list.</p>
        <div class="spacer-xs"></div>
        <p class="text-body" style="font-weight: 500; color: var(--color-text-primary);">Pick 6–8 to start.</p>
        
        <div class="spacer-sm"></div>

        <!-- Filters Area -->
        <div class="filters-container" style="justify-content: flex-end;">
          <!-- Veg Only Toggle (Right side) -->
          <div class="toggle-wrapper">
            <span class="text-body" style="font-weight: 500; font-size: 13px;">Veg only</span>
            <label class="switch">
              <input type="checkbox" id="veg-toggle">
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <!-- Scrollable list/grid of meals -->
        <div class="meals-grid" id="meals-grid">
          <!-- Populated dynamically via JS -->
        </div>

        <!-- Controls area -->
        <div style="margin-top: auto; padding-top: var(--space-xs); display: flex; flex-direction: column; align-items: center; width: 100%;">
          <span id="selection-count" class="selection-count-label" style="visibility: hidden;">
            0 meals selected
          </span>
          <button id="onboarding-next-btn" class="btn-primary" disabled style="width: 100%;">
            <span>Next</span>
            <i data-lucide="arrow-right" class="icon" style="color: var(--color-base);"></i>
          </button>
        </div>

      </div>
      
      

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
