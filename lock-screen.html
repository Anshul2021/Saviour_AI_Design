<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saviour - Notification Lock Screen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Physical phone mockup frame container -->
  <div class="phone-viewport">
    <div class="phone-notch"></div>
    
    <div class="lock-screen-container">
      <!-- Large digital lockscreen clock -->
      <div class="lock-screen-clock">5:00</div>
      <!-- Lockscreen date -->
      <div class="lock-screen-date">Monday, Apr 7</div>
      
      <!-- Placeholder container for the reusable notification card -->
      <div id="notification-placeholder" style="width: 100%;"></div>
      
      <!-- Lockscreen footer helper caption -->
      <div class="lock-screen-footer">
        Notification stays until you respond — even if you swipe
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Fetch and inject the reusable notification card
      fetch('notification.html')
        .then(response => {
          if (!response.ok) {
            throw new Error('Failed to load notification snippet');
          }
          return response.text();
        })
        .then(html => {
          const placeholder = document.getElementById('notification-placeholder');
          placeholder.innerHTML = html;
          
          // Add click redirect handler to the loaded card
          const card = placeholder.querySelector('.notification-card');
          if (card) {
            card.addEventListener('click', () => {
              window.location.href = 'energy-check.html';
            });
          }
        })
        .catch(err => {
          console.error(err);
          // Inline fallback if fetch fails in local environments
          document.getElementById('notification-placeholder').innerHTML = `
            <div class="notification-card" onclick="window.location.href='energy-check.html'">
              <div class="notification-icon-container">
                <img src="https://img.icons8.com/office/80/frying-pan.png" alt="Mise logo" class="notification-icon-img">
              </div>
              <div class="notification-text-container">
                <div class="notification-meta">
                  <span>MISE</span>
                  <span class="meta-divider">·</span>
                  <span>NOW</span>
                </div>
                <div class="notification-title-bold">How's your energy tonight?</div>
                <div class="notification-body-text">Tap to decide tonight's meal</div>
              </div>
            </div>
          `;
        });
    });
  </script>
</body>
</html>
