<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropdown Component - Saviour UI</title>
  <link rel="stylesheet" href="../../global.css">
  <style>
    body {
      padding: 40px;
    }
    .showcase-container {
      display: flex;
      flex-direction: column;
      gap: 32px;
      max-width: 600px;
      margin: 0 auto;
    }
    .showcase-section {
      background: var(--color-surface);
      padding: 24px;
      border-radius: var(--radius-xl);
      border: 1px solid rgba(46, 42, 36, 0.06);
    }

    /* ==========================================================================
       DROPDOWN COMPONENT STYLES
       ========================================================================== */
    .c-dropdown {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background-color: var(--color-surface); /* #F0E9DE */
      border-radius: var(--radius-sm); /* 8px */
      color: var(--color-text-primary); /* #2E2A24 */
      font-family: var(--font-interface);
      font-size: var(--font-size-body); /* 14px */
      font-weight: var(--font-weight-regular); /* 400 */
      line-height: var(--line-height-body); /* 22.40px */
      cursor: pointer;
      border: none;
      transition: var(--transition-smooth);
    }
    .c-dropdown:hover {
      background-color: var(--color-surface-raised);
    }
    .c-dropdown__arrow {
      width: 12px;
      height: 12px;
      display: block;
    }
    .c-dropdown__arrow svg {
      display: block;
    }
  </style>
</head>
<body>

  <div class="showcase-container">
    <h1 class="ty-display">Dropdown Trigger</h1>
    <p class="ty-body">Dropdown triggers let the user select a value from a list of options.</p>

    <div class="showcase-section">
      <button class="c-dropdown">
        <span>Full</span>
        <span class="c-dropdown__arrow">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 4.5L6 7.5L9 4.5" stroke="var(--color-text-secondary)" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </button>
    </div>
  </div>

</body>
</html>
