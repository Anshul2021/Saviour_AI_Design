<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saviour - Notification Lock Screen (6:30 PM)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Physical phone mockup frame container -->
  <div class="phone-viewport">
    <div class="phone-notch"></div>
    
    <div class="lock-screen-container">
      <!-- Large digital lockscreen clock -->
      <div class="lock-screen-clock" id="lockscreen-clock">6:30</div>
      <!-- Lockscreen date -->
      <div class="lock-screen-date" id="lockscreen-date">Monday, Apr 7</div>
      
      <!-- Placeholder container for the reusable notification card -->
      <div id="notification-placeholder" style="width: 100%;"></div>
      
      <!-- Lockscreen footer helper caption -->
      <div class="lock-screen-footer">
        Notification stays until you respond — even if you swipe
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Calculate time and date
      const userLeaveTime = localStorage.getItem('userLeaveTime') || '7:00 PM';
      const nudgeTime = calculateNudgeTime(userLeaveTime);
      
      // Separate AM/PM from time for the clock
      const nudgeTimeParts = nudgeTime.split(' ');
      document.getElementById('lockscreen-clock').textContent = nudgeTimeParts[0];

      // Update date
      const options = { weekday: 'long', month: 'short', day: 'numeric' };
      const today = new Date();
      // Format as "Monday, Apr 7"
      const dateText = today.toLocaleDateString('en-US', options);
      document.getElementById('lockscreen-date').textContent = dateText;

      // 2. Fetch and inject the reusable notification card
      fetch('notification.html')
        .then(response => {
          if (!response.ok) {
            throw new Error('Failed to load notification snippet');
          }
          return response.text();
        })
        .then(html => {
          const placeholder = document.getElementById('notification-placeholder');
          placeholder.innerHTML = html;
          
          // Customize the notification for 6:30 PM
          customizeNotification(placeholder);
        })
        .catch(err => {
          console.error(err);
          // Inline fallback if fetch fails in local environments
          const placeholder = document.getElementById('notification-placeholder');
          placeholder.innerHTML = `
            <div class="notification-card" id="fallback-card">
              <div class="notification-icon-container">
                <img src="https://img.icons8.com/office/80/frying-pan.png" alt="Mise logo" class="notification-icon-img">
              </div>
              <div class="notification-text-container">
                <div class="notification-meta">
                  <span>MISE</span>
                  <span class="meta-divider">·</span>
                  <span>NOW</span>
                </div>
                <div class="notification-title-bold" id="fallback-title">Tonight: Dal chawal</div>
                <div class="notification-body-text" id="fallback-text">Ready in 18 mins. Everything is at home!</div>
              </div>
            </div>
          `;
          
          const card = document.getElementById('fallback-card');
          if (card) {
            // Apply fallback customizations
            const userEnergyLevel = localStorage.getItem('userEnergyLevel') || 'okay';
            let recipeName = "Warm tomato & white bean stew";
            let cookTime = "12 mins";
            
            if (userEnergyLevel === 'okay') {
              recipeName = "Dal chawal";
              cookTime = "18 mins";
            } else if (userEnergyLevel === 'fine') {
              recipeName = "Rajma rice";
              cookTime = "35 mins";
            }
            
            document.getElementById('fallback-title').textContent = `Tonight: ${recipeName}`;
            document.getElementById('fallback-text').textContent = `Ready in ${cookTime}. Everything is at home!`;
            
            card.addEventListener('click', () => {
              window.location.href = 'tonight.html';
            });
          }
        });
    });

    // Customize title and subtitle based on user energy level selections
    function customizeNotification(container) {
      const card = container.querySelector('.notification-card');
      const titleEl = container.querySelector('.notification-title-bold');
      const textEl = container.querySelector('.notification-body-text');

      if (titleEl && textEl) {
        const userEnergyLevel = localStorage.getItem('userEnergyLevel') || 'okay';
        let recipeName = "Warm tomato & white bean stew";
        let cookTime = "12 mins";
        
        if (userEnergyLevel === 'okay') {
          recipeName = "Dal chawal";
          cookTime = "18 mins";
        } else if (userEnergyLevel === 'fine') {
          recipeName = "Rajma rice";
          cookTime = "35 mins";
        }

        titleEl.textContent = `Tonight: ${recipeName}`;
        textEl.textContent = `Ready in ${cookTime}. Everything is at home!`;
      }

      if (card) {
        card.addEventListener('click', () => {
          window.location.href = 'tonight.html';
        });
      }
    }

    // Helper to calculate 30 minutes before leave time
    function calculateNudgeTime(timeStr) {
      try {
        const parts = timeStr.split(' ');
        const timeParts = parts[0].split(':');
        let hour = parseInt(timeParts[0]);
        let min = parseInt(timeParts[1]);

        // Subtract 30 minutes
        min -= 30;
        if (min < 0) {
          min += 60;
          hour -= 1;
          if (hour <= 0) {
            hour = 12;
          }
        }
        
        const minStr = min.toString().padStart(2, '0');
        const hourStr = hour.toString();
        const ampm = parts[1];

        return `${hourStr}:${minStr} ${ampm}`;
      } catch (e) {
        return "6:30 PM";
      }
    }
  </script>
</body>
</html>
