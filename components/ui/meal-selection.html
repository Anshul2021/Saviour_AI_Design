<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meal Selection Component - Saviour UI</title>
  <link rel="stylesheet" href="../../global.css">
  <style>
    body {
      padding: 40px;
    }
    .showcase-container {
      display: flex;
      flex-direction: column;
      gap: 32px;
      max-width: 600px;
      margin: 0 auto;
    }
    .showcase-section {
      background: var(--color-surface);
      padding: 32px;
      border-radius: var(--radius-xl);
      border: 1px solid rgba(46, 42, 36, 0.06);
      display: flex;
      gap: 40px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .state-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .state-label {
      font-size: 11px;
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    /* ==========================================================================
       MEAL SELECTION OPTION COMPONENT STYLES
       ========================================================================== */
    .c-meal-option {
      display: inline-flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      transition: var(--transition-smooth);
    }
    
    .c-meal-option__avatar-wrapper {
      width: 64px;
      height: 72px; /* Includes padding bottom 8px */
      padding-bottom: 8px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
    }
    
    .c-meal-option__avatar {
      width: 64px;
      height: 64px;
      border-radius: 32px; /* 50% border radius */
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--color-surface); /* #F0E9DE default */
      outline: 1px rgba(0, 0, 0, 0) solid;
      outline-offset: -1px;
      transition: var(--transition-smooth);
      overflow: hidden;
    }

    /* Selected State Override */
    .c-meal-option.is-selected .c-meal-option__avatar {
      background-color: var(--color-action); /* #E07A55 */
      outline: 1px var(--color-action) solid;
    }

    /* Image Wrapper */
    .c-meal-option__img {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .c-meal-option__img svg {
      width: 34px;
      height: 34px;
      display: block;
    }
    
    /* Toggle Image vs Checkmark depending on selection */
    .c-meal-option__check {
      display: none;
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      justify-content: center;
      align-items: center;
      background-color: var(--color-action);
      border-radius: 50%;
    }
    .c-meal-option.is-selected .c-meal-option__check {
      display: flex;
    }
    .c-meal-option.is-selected .c-meal-option__img {
      display: none;
    }

    /* Custom placeholder for dynamically added meals */
    .c-meal-option__img-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--color-surface-raised);
      color: var(--color-text-secondary);
      font-family: var(--font-interface);
      font-size: var(--font-size-subheading);
      font-weight: var(--font-weight-medium);
    }
    .c-meal-option.is-selected .c-meal-option__img-placeholder {
      display: none;
    }

    /* Custom Add State Override */
    .c-meal-option--custom .c-meal-option__avatar {
      background-color: transparent;
      outline: 1px var(--color-text-secondary) solid; /* #8C7E6A */
    }
    .c-meal-option--custom:hover .c-meal-option__avatar {
      background-color: rgba(140, 126, 106, 0.05);
    }

    /* Label text formatting */
    .c-meal-option__label {
      text-align: center;
      color: var(--color-text-primary); /* #2E2A24 */
      font-family: var(--font-interface);
      font-size: var(--font-size-body-small); /* 12px */
      font-weight: var(--font-weight-regular); /* 400 */
      line-height: var(--line-height-body-small); /* 15.95px */
      word-wrap: break-word;
    }
  </style>
</head>
<body>

  <div class="showcase-container">
    <h1 class="ty-display">Meal Selection Option</h1>
    <p class="ty-body">Meal selection options are clickable items representing dishes that the user can choose. Supports Selected, Unselected, and Add Custom states.</p>

              <div class="c-meal-option__check">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M20 6L9 17L4 12" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
            </div>
          </div>
          <span class="c-meal-option__label">Dal chawal</span>
        </div>
      </div>

      <div class="state-container">
        <span class="state-label">Add Custom Button</span>
        <div class="c-meal-option c-meal-option--custom">
          <div class="c-meal-option__avatar-wrapper">
            <div class="c-meal-option__avatar">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

    </div>
  </div>
