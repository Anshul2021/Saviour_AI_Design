<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saviour - Let's Cook</title>
  <meta name="description" content="Step-by-step cooking guide customized for your energy.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Scoped styling for cooking timer screen */
    .cook-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
      padding: var(--space-xl) 0 var(--space-md) 0;
    }

    .timer-circle-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-grow: 1;
      margin: var(--space-lg) 0;
    }

    .timer-circle {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      border: 1px solid var(--color-text-ghost);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: border-color 0.5s ease, background-color 0.5s ease;
      background-color: transparent;
    }

    .timer-display {
      font-family: var(--font-family-ui);
      font-size: 56px;
      font-weight: 300;
      color: var(--color-text-primary);
      line-height: 1;
      transition: color 0.5s ease;
    }

    .status-text-area {
      text-align: center;
      margin-bottom: var(--space-xl);
      padding: 0 var(--space-md);
      min-height: 48px;
    }

    .status-text {
      font-family: var(--font-family-ui);
      font-size: 14px;
      line-height: 1.6;
      color: var(--color-text-secondary);
      transition: color 0.3s ease;
    }

    .action-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      align-items: center;
      margin-top: auto;
    }

    /* Skip timer ghost button */
    .skip-timer-btn {
      background: none;
      border: none;
      color: var(--color-text-ghost);
      font-family: var(--font-family-ui);
      font-size: 13px;
      font-weight: 300;
      padding: var(--space-xs);
      cursor: pointer;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: auto;
      transition: color 0.2s ease, opacity 0.3s ease;
    }

    .skip-timer-btn:hover {
      color: var(--color-text-secondary);
    }
  </style>
</head>
<body>

  <!-- Physical phone mockup frame container -->
  <div class="phone-viewport">
    <div class="phone-notch"></div>
    
    <div class="screen-container">
      <div class="cook-container">
        
        <!-- Top header / Back link & Recipe title -->
        <div style="width: 100%;">
          <div style="margin-bottom: var(--space-md);">
            <a href="tonight.html" class="back-link">
              <i data-lucide="arrow-left" class="icon" style="width: 14px; height: 14px; margin-right: 4px;"></i>
              <span>Back</span>
            </a>
          </div>
          
          <div style="text-align: center; margin-top: var(--space-sm);">
            <span class="text-label" style="color: var(--color-text-ghost); font-size: 11px;">COOKING NOW</span>
            <h1 class="text-display" id="cook-recipe-title" style="margin-top: 4px; font-size: 28px;">Dal Rice</h1>
          </div>
        </div>

        <!-- Center: Circular Timer -->
        <div class="timer-circle-container">
          <div id="timer-circle" class="timer-circle">
            <span id="timer-display" class="timer-display">20:00</span>
          </div>
        </div>

        <!-- Center-bottom: Helper status text -->
        <div class="status-text-area">
          <p id="timer-status-text" class="status-text">
            Timer's running in the background.<br>Close the app. Go cook.
          </p>
        </div>

        <!-- Bottom: Actions -->
        <div class="action-group">
          <button id="finish-btn" class="btn-primary" style="width: 100%;" disabled>
            <span>Done Cooking</span>
          </button>
          
          <button id="skip-timer-btn" class="skip-timer-btn">
            Skip timer
          </button>
        </div>

      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Initialize Lucide icons
      if (window.lucide) {
        window.lucide.createIcons();
      }

      // Read values from localStorage
      const userEnergyLevel = localStorage.getItem('userEnergyLevel') || 'okay';

      // Recipe database matching tonight's selection
      const recipes = {
        'exhausted': {
          title: "Warm tomato & white bean stew",
          time: 12
        },
        'okay': {
          title: "Dal Rice",
          time: 20
        },
        'fine': {
          title: "Rajma Rice",
          time: 35
        }
      };

      const selectedRecipe = recipes[userEnergyLevel] || recipes['okay'];
      
      // Populate Recipe Title
      document.getElementById('cook-recipe-title').textContent = selectedRecipe.title;

      // Timer variables
      let totalSeconds = selectedRecipe.time * 60;
      const timerDisplay = document.getElementById('timer-display');
      const timerCircle = document.getElementById('timer-circle');
      const timerStatusText = document.getElementById('timer-status-text');
      const finishBtn = document.getElementById('finish-btn');
      const skipBtn = document.getElementById('skip-timer-btn');

      // Helper to format MM:SS
      function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      }

      // Render initial time
      timerDisplay.textContent = formatTime(totalSeconds);

      // Start countdown interval
      let countdownInterval = setInterval(() => {
        if (totalSeconds > 0) {
          totalSeconds--;
          timerDisplay.textContent = formatTime(totalSeconds);
        } else {
          clearInterval(countdownInterval);
          handleTimerComplete();
        }
      }, 1000);

      // Handle Timer Completion (either naturally or via Skip)
      function handleTimerComplete() {
        clearInterval(countdownInterval);
        totalSeconds = 0;
        timerDisplay.textContent = formatTime(0);

        // A. Enable Done Cooking button
        finishBtn.disabled = false;

        // B. Apply success visual states
        timerCircle.style.borderColor = 'var(--color-success)';
        timerCircle.style.backgroundColor = 'rgba(163, 196, 168, 0.08)';
        timerDisplay.style.color = 'var(--color-success)';
        timerDisplay.style.fontWeight = '500';

        // C. Update status description
        timerStatusText.innerHTML = 'Dinner is ready!<br>Enjoy your dinner!';
        timerStatusText.style.color = 'var(--color-success)';

        // D. Fade out Skip button
        skipBtn.style.opacity = '0';
        skipBtn.style.pointerEvents = 'none';
      }

      // Skip timer event listener
      skipBtn.addEventListener('click', () => {
        handleTimerComplete();
      });

      // Finish cooking action (Routing)
      finishBtn.addEventListener('click', () => {
        if (userEnergyLevel === 'okay' || userEnergyLevel === 'fine') {
          // Keep energy level for the overnight prep screen, clear other onboarding state
          localStorage.removeItem('userLeaveTime');
          window.location.href = 'overnight-prep-screen.html';
        } else {
          // Exhausted or fallback: clear all and go home
          localStorage.removeItem('userLeaveTime');
          localStorage.removeItem('userEnergyLevel');
          window.location.href = 'index.html';
        }
      });
    });
  </script>
</body>
</html>
