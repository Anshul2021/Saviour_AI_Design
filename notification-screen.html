<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saviour Onboarding - Lock Screen Notification</title>
  <meta name="description" content="Saviour Lock Screen Notification simulation.">
  <link rel="stylesheet" href="global.css">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body>

  <!-- Responsive App Container fitting viewport height -->
  <div class="app-container c-lock-screen" id="app-container" data-page="notification-screen">
    
    <!-- iPhone Lock Screen Wallpaper -->
    <img src="Assets/Wallpaper.png" alt="Lock Screen Wallpaper" class="c-lock-screen__wallpaper">
    
    <!-- Dark screen overlay -->
    <div class="c-lock-screen__overlay"></div>
    
    <!-- Progressive Blur overlay for top status bar area -->
    <div class="c-lock-screen__progressive-blur"></div>

    <!-- 1. Dynamic iPhone Status Bar Component (overridden to white theme via CSS) -->
    <header data-component="status-bar" id="app-status-bar"></header>

    <!-- Header containing Date and Time -->
    <div class="c-lock-screen__header">
      <div class="c-lock-screen__date">Monday, June 6</div>
      <div class="c-lock-screen__time">5:30</div>
    </div>

    <!-- Notifications Container -->
    <div class="c-lock-screen__notifications">
      <a href="energy-level.html" class="c-notification-card js-notification-card">
        <div class="c-notification-card__icon-wrapper">
          <img src="Assets/Iconmark.png" alt="Saviour Icon" class="c-notification-card__icon">
        </div>
        <!-- Card Text Content -->
        <div class="c-notification-card__content">
          <div class="c-notification-card__title">How’s your energy today?</div>
          <div class="c-notification-card__desc">Tell us how you feel right now</div>
        </div>
        <!-- Received Time -->
        <div class="c-notification-card__time">5:30 PM</div>
      </a>
    </div>

  </div>

  <!-- Standard script link -->
  <script src="global.js"></script>
</body>
</html>
