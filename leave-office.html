<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saviour Onboarding - Leave Office Time</title>
  <meta name="description" content="Select the time you usually leave the office to schedule your dinner decision checks.">
  <link rel="stylesheet" href="global.css">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Dynamic Time Picker font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Responsive App Container fitting viewport height -->
  <div class="app-container" id="app-container" data-page="leave-office">
    <!-- Glow Backdrop -->
    <div class="ambient-glow"></div>

    <!-- 1. Dynamic iPhone Status Bar Component -->
    <header data-component="status-bar" id="app-status-bar"></header>

    <!-- 2. Scrollable Body Content -->
    <main class="app-content">
      
      <!-- Header Area -->
      <div class="onboarding-header">
        <!-- Back Link Navigation -->
        <div class="onboarding-back-link">
          <a href="pantry.html" class="c-back-link">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M7.00033 11.0834L2.91699 7.00008L7.00033 2.91675" stroke="var(--color-text-secondary)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M11.0837 7H2.91699" stroke="var(--color-text-secondary)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Back</span>
          </a>
        </div>
        
        <!-- H1 Title -->
        <h1 class="ty-display">When do you usually leave office?</h1>
        <!-- Description -->
        <p class="ty-body text-secondary">We'll send your energy check 30 minutes before you get home — so dinner is already decided when you walk in.</p>
      </div>

      <!-- iOS-style Time Picker Wheel -->
      <div class="c-time-picker">
        <!-- Highlight bar behind the text -->
        <div class="c-time-picker__highlight"></div>

        <!-- Wheel columns -->
        <div class="c-time-picker__columns">
          <!-- Hour Column -->
          <div class="c-time-picker__col c-time-picker__col--hour" id="picker-hours">
            <!-- Populated via JavaScript -->
          </div>

          <!-- Minute Column -->
          <div class="c-time-picker__col c-time-picker__col--minute" id="picker-minutes">
            <!-- Populated via JavaScript -->
          </div>

          <!-- Period Column (AM/PM) -->
          <div class="c-time-picker__col c-time-picker__col--period" id="picker-period">
            <!-- Populated via JavaScript -->
          </div>
        </div>

        <!-- Cylindrical shade overlays -->
        <div class="c-time-picker__gradient-top"></div>
        <div class="c-time-picker__gradient-bottom"></div>
      </div>

    </main>

    <!-- 3. Fixed Bottom Controls Area with dynamic iOS Home Indicator -->
    <footer class="controls-area" id="app-footer">
      <!-- Primary Action CTA Button -->
      <button class="controls-area__btn" id="next-btn">
        <span>Let's Go...!</span>
        <!-- Arrow right SVG -->
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3.75 9H14.25M9 14.25L14.25 9L9 3.75" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      
      <!-- Reusable Home Indicator Component Placeholder -->
      <div data-component="home-indicator" id="app-home-indicator"></div>
    </footer>
  </div>

  <!-- Standard non-module script link for offline CORS resilience -->
  <script src="global.js"></script>
</body>
</html>
