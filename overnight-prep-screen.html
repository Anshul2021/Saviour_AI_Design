<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tonight — Overnight Prep</title>
  <meta name="description" content="One small thing before you put your phone down.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Custom styling for overnight-prep-screen */
    .prep-screen-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
      padding: var(--space-xl) 0 var(--space-md) 0;
      position: relative;
    }

    /* Transition states for views */
    .view-fade {
      opacity: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transform: translateY(0);
    }

    .view-fade.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
      position: absolute;
      top: 0;
      left: 0;
      display: none !important;
    }

    /* Sleep / Close View specific */
    .sleep-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100%;
      flex-grow: 1;
    }

    /* Prep Card custom layout */
    .prep-card {
      background-color: var(--color-surface); /* #F0E9DE */
      border-radius: 16px;
      padding: var(--space-md);
      text-align: left;
      width: 100%;
      border: none;
      box-shadow: none; /* No shadow */
      transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      margin: var(--space-lg) 0;
    }

    @keyframes scaleSettle {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .prep-card.tapped {
      animation: scaleSettle 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    .prep-card-row {
      display: flex;
      gap: var(--space-md);
      align-items: center;
    }

    .prep-icon-container {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background-color: var(--color-surface-raised); /* #EDE3D4 */
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .prep-emoji-img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .prep-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .prep-title {
      font-family: var(--font-family-ui);
      font-size: 15px;
      font-weight: 500;
      color: var(--color-text-primary);
    }

    .prep-instruction {
      font-family: var(--font-family-ui);
      font-size: 14px;
      font-weight: 400;
      color: var(--color-text-secondary);
    }

    .prep-duration {
      font-family: var(--font-family-ui);
      font-size: 12px;
      font-weight: 400;
      color: var(--color-text-ghost);
    }

    .prep-divider {
      border: 0;
      height: 1px;
      background-color: var(--color-surface-raised); /* #EDE3D4 */
      margin: var(--space-md) 0;
    }

    .prep-footer-note {
      font-family: var(--font-family-ui);
      font-size: 12px;
      font-weight: 400;
      color: var(--color-text-ghost);
      line-height: 1.5;
    }

    /* Success confirm */
    .success-confirm {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--color-success); /* #A3C4A8 */
      font-family: var(--font-family-ui);
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      text-align: center;
      width: 100%;
      margin-top: 12px;
    }

    .success-confirm.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* CTA Area */
    .cta-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-top: auto;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .cta-area.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(4px);
    }

    .skip-btn {
      background: none;
      border: none;
      outline: none;
      box-shadow: none;
      font-family: var(--font-family-ui);
      font-size: 13px;
      font-weight: 400;
      color: var(--color-text-ghost);
      cursor: pointer;
      padding: var(--space-xs);
      transition: color 0.2s ease;
      text-decoration: none;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px; /* Accessible tap target */
      width: auto;
    }

    .skip-btn:hover {
      color: var(--color-text-secondary);
    }
  </style>
</head>
<body>

  <!-- Physical phone mockup frame container -->
  <div class="phone-viewport">
    <div class="phone-notch"></div>
    
    <div class="screen-container">
      <div class="prep-screen-container">
        
        <!-- State 1: Overnight Instructions View -->
        <div id="instruction-view" class="view-fade">
          
          <!-- Top section -->
          <div style="width: 100%; text-align: left; display: flex; flex-direction: column;">
            <!-- Top Ghost Label -->
            <span class="text-label" style="color: var(--color-text-ghost); font-size: 11px; margin-top: var(--space-xs); margin-bottom: 8px;">
              ONE THING BEFORE YOU SLEEP
            </span>
            
            <!-- Headline -->
            <h1 class="text-display" style="font-size: 28px; line-height: 1.25; font-weight: 400; color: var(--color-text-primary);">
              Tomorrow sorted in 30 seconds.
            </h1>
          </div>

          <!-- Central Instruction Card -->
          <div class="prep-card" id="prep-card">
            <div class="prep-card-row">
              <div class="prep-icon-container">
                <img src="https://img.icons8.com/emoji/96/beans-emoji.png" alt="Rajma beans emoji" class="prep-emoji-img" id="prep-emoji">
              </div>
              <div class="prep-info">
                <span class="prep-title" id="prep-title">Rajma</span>
                <span class="prep-instruction" id="prep-instruction">Soak ½ cup in water</span>
                <span class="prep-duration" id="prep-duration">Leave overnight · done by morning</span>
              </div>
            </div>
            
            <hr class="prep-divider">
            
            <p class="prep-footer-note" id="prep-footer-note">
              Tomorrow's Rajma Rice cooks in 20 min instead of 45. Soaking does the hard part tonight.
            </p>
          </div>

          <!-- Success Nudge Confirmation (Hidden initially) -->
          <div class="success-confirm" id="success-confirm">
            <span>✓</span> <span id="success-confirm-text">Rajma soaking.</span>
          </div>

          <!-- Bottom buttons CTA -->
          <div class="cta-area" id="cta-area">
            <button id="done-soaking-btn" class="btn-primary" style="width: 100%;">
              <span>Done, it's soaking.</span>
            </button>
            
            <button id="skip-btn" class="skip-btn">
              Skip for tonight
            </button>
          </div>
          
        </div>

        <!-- State 2: Good Night Sleepy View (Hidden initially) -->
        <div id="sleep-view" class="view-fade hidden sleep-view">
          <h1 class="text-display" style="font-size: 32px; font-weight: 400; color: var(--color-text-primary); margin-bottom: var(--space-xs);">
            Good night.
          </h1>
          <p class="text-body-secondary" style="font-size: 15px; color: var(--color-text-secondary);">
            We'll remind you at 6:30 tomorrow.
          </p>
        </div>

      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Interaction state triggers
      const doneBtn = document.getElementById('done-soaking-btn');
      const skipBtn = document.getElementById('skip-btn');
      const card = document.getElementById('prep-card');
      const successConfirm = document.getElementById('success-confirm');
      const ctaArea = document.getElementById('cta-area');
      const instructionView = document.getElementById('instruction-view');
      const sleepView = document.getElementById('sleep-view');

      // "Done, it's soaking" click interaction
      doneBtn.addEventListener('click', () => {
        // A. Card animation: scale-up then settle
        card.classList.add('tapped');
        
        // B. Success confirmation line fades in below the card
        successConfirm.classList.add('show');
        
        // C. Button area disappears
        ctaArea.classList.add('hidden');
        
        // D. After 1.2 seconds, transition screen to close/sleep state
        setTimeout(() => {
          // Smooth fade out of instruction view
          instructionView.style.opacity = '0';
          instructionView.style.transform = 'translateY(-12px)';
          instructionView.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
          
          setTimeout(() => {
            instructionView.classList.add('hidden');
            
            // Prepare and animate sleep view
            sleepView.classList.remove('hidden');
            sleepView.style.opacity = '0';
            sleepView.style.transform = 'translateY(12px)';
            sleepView.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
            
            // Force reflow
            sleepView.offsetHeight;
            
            // Fade in
            sleepView.style.opacity = '1';
            sleepView.style.transform = 'translateY(0)';
            
            // E. Hold for 2 seconds then auto-dismiss
            setTimeout(() => {
              window.location.href = 'home.html';
            }, 2000);
          }, 400);
        }, 1200);
      });

      // "Skip for tonight" click interaction
      skipBtn.addEventListener('click', () => {
        // Silent. No confirmation. No animation. Screen closes immediately.
        window.location.href = 'home.html';
      });
    });
  </script>
</body>
</html>
