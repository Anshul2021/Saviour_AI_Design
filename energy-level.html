<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saviour Onboarding - How's your energy?</title>
  <meta name="description" content="Select your energy level tonight.">
  <link rel="stylesheet" href="global.css">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body>

  <!-- Responsive App Container fitting viewport height -->
  <div class="app-container c-energy-selection" id="app-container" data-page="energy-level">
    
    <!-- Ambient Backdrop Glow -->
    <div class="ambient-glow"></div>
    
    <!-- 1. Dynamic iPhone Status Bar Component -->
    <header data-component="status-bar" id="app-status-bar"></header>

    <!-- 2. Foreground Header Area -->
    <div class="c-energy-header-v2">
      <div class="c-energy-time" id="live-time">5:00 PM &middot; Monday</div>
      <h1 class="ty-display">How's your energy<br/>tonight?</h1>
    </div>

    <!-- 3. Block Buttons Stack -->
    <div class="c-energy-button-list">
      
      <!-- Button 1: Exhausted -->
      <button class="c-energy-card-btn c-energy-card-btn--exhausted js-energy-bubble" id="energy-exhausted" type="button">
        <div class="c-energy-card-btn__left">
          <div class="c-energy-card-btn__info">
            <span class="c-energy-card-btn__title">Exhausted</span>
            <span class="c-energy-card-btn__subtitle">Tired & low energy</span>
          </div>
          <div class="c-energy-card-btn__arrow">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </div>
        </div>
        <div class="c-energy-card-btn__avatar-wrapper">
          <img src="Assets/Energy-Avatar/exhausted.png" alt="Exhausted avatar" class="c-energy-card-btn__avatar">
        </div>
      </button>

      <!-- Button 2: Tired -->
      <button class="c-energy-card-btn c-energy-card-btn--tired js-energy-bubble" id="energy-tired" type="button">
        <div class="c-energy-card-btn__left">
          <div class="c-energy-card-btn__info">
            <span class="c-energy-card-btn__title">Tired</span>
            <span class="c-energy-card-btn__subtitle">Feeling steady</span>
          </div>
          <div class="c-energy-card-btn__arrow">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </div>
        </div>
        <div class="c-energy-card-btn__avatar-wrapper">
          <img src="Assets/Energy-Avatar/Normal.png" alt="Tired avatar" class="c-energy-card-btn__avatar">
        </div>
      </button>

      <!-- Button 3: Energetic -->
      <button class="c-energy-card-btn c-energy-card-btn--energetic js-energy-bubble" id="energy-energetic" type="button">
        <div class="c-energy-card-btn__left">
          <div class="c-energy-card-btn__info">
            <span class="c-energy-card-btn__title">Energetic</span>
            <span class="c-energy-card-btn__subtitle">Charged & ready</span>
          </div>
          <div class="c-energy-card-btn__arrow">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </div>
        </div>
        <div class="c-energy-card-btn__avatar-wrapper">
          <img src="Assets/Energy-Avatar/energetic.png" alt="Energetic avatar" class="c-energy-card-btn__avatar">
        </div>
      </button>

    </div>

    <!-- 4. Reusable Home Indicator Component Placeholder -->
    <div data-component="home-indicator" id="app-home-indicator"></div>
  </div>

  <!-- Standard non-module script link for offline CORS resilience -->
  <script src="global.js"></script>
</body>
</html>
