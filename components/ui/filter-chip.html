<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filter Chip Component - Saviour UI</title>
  <link rel="stylesheet" href="../../global.css">
  <style>
    body {
      padding: 40px;
    }
    .showcase-container {
      display: flex;
      flex-direction: column;
      gap: 32px;
      max-width: 600px;
      margin: 0 auto;
    }
    .showcase-section {
      background: var(--color-surface);
      padding: 24px;
      border-radius: var(--radius-xl);
      border: 1px solid rgba(46, 42, 36, 0.06);
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
    }
    .state-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .state-label {
      font-size: 11px;
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ==========================================================================
       FILTER CHIP COMPONENT STYLES
       ========================================================================== */
    .c-filter-chip {
      padding: 2px 8px;
      background-color: var(--color-base); /* #FAF7F2 */
      border-radius: var(--radius-round); /* 24px / 999px */
      display: inline-flex;
      justify-content: center;
      align-items: center;
      color: var(--color-text-secondary); /* #8C7E6A */
      font-family: var(--font-interface);
      font-size: var(--font-size-body); /* 14px */
      font-weight: var(--font-weight-regular); /* 400 */
      line-height: var(--line-height-body); /* 22.40px */
      border: none;
      cursor: pointer;
      transition: var(--transition-smooth);
      text-align: center;
    }

    /* State: Hover */
    .c-filter-chip:hover,
    .c-filter-chip.is-hover {
      background-color: var(--color-surface); /* #F0E9DE */
      color: var(--color-text-primary); /* #2E2A24 */
    }

    /* State: Selected */
    .c-filter-chip.is-selected {
      background-color: var(--color-surface-raised); /* #EDE3D4 */
      color: var(--color-text-primary); /* #2E2A24 */
      padding: 2px 16px;
    }

    /* State: Focused */
    .c-filter-chip.is-focused {
      background-color: var(--color-base); /* #FAF7F2 */
      color: var(--color-text-primary);
      outline: 1px var(--color-warning) solid; /* #C4844A */
      outline-offset: -1px;
    }

    /* State: Disabled */
    .c-filter-chip:disabled,
    .c-filter-chip.is-disabled {
      opacity: 0.50;
      background-color: var(--color-base);
      color: var(--color-text-ghost); /* #C4B5A5 */
      cursor: not-allowed;
    }

    /* State: Semantic */
    .c-filter-chip.c-filter-chip--semantic {
      background-color: var(--color-action); /* #E07A55 */
      color: var(--color-action-subtle); /* #FAEAE0 */
      padding: 2px 16px;
    }
  </style>
</head>
<body>

  <div class="showcase-container">
    <h1 class="ty-display">Filter Chip</h1>
    <p class="ty-body">Filter chips allow users to refine content, toggle active filters, or view status categorizations.</p>

    <div class="showcase-section">
      <!-- State: Default -->
      <div class="state-group">
        <span class="state-label">Default</span>
        <button class="c-filter-chip">All</button>
      </div>

      <!-- State: Selected -->
      <div class="state-group">
        <span class="state-label">Selected</span>
        <button class="c-filter-chip is-selected">All</button>
      </div>

      <!-- State: Hover -->
      <div class="state-group">
        <span class="state-label">Hover</span>
        <button class="c-filter-chip is-hover">All</button>
      </div>

      <!-- State: Focused -->
      <div class="state-group">
        <span class="state-label">Focused</span>
        <button class="c-filter-chip is-focused">All</button>
      </div>

      <!-- State: Disabled -->
      <div class="state-group">
        <span class="state-label">Disabled</span>
        <button class="c-filter-chip" disabled>All</button>
      </div>

      <!-- State: Semantic -->
      <div class="state-group">
        <span class="state-label">Semantic</span>
        <button class="c-filter-chip c-filter-chip--semantic">All</button>
      </div>
    </div>
  </div>

</body>
</html>
