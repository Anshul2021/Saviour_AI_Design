<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pantry Item Component - Saviour UI</title>
  <link rel="stylesheet" href="../../global.css">
  <style>
    body {
      padding: 40px;
    }
    .showcase-container {
      display: flex;
      flex-direction: column;
      gap: 32px;
      max-width: 500px;
      margin: 0 auto;
    }
    .showcase-section {
      background: var(--color-base);
      padding: 24px;
      border-radius: var(--radius-xl);
      border: 1px solid rgba(46, 42, 36, 0.06);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .state-label {
      font-size: 11px;
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    /* ==========================================================================
       PANTRY ITEM COMPONENT STYLES
       ========================================================================== */
    .c-pantry-item {
      width: 308px;
      padding: 12px;
      background-color: var(--color-surface); /* #F0E9DE */
      border-radius: var(--radius-lg); /* 12px */
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid rgba(46, 42, 36, 0.04);
      transition: var(--transition-smooth);
    }
    
    .c-pantry-item__checkbox {
      width: 22px;
      height: 22px;
      background-color: var(--color-base); /* #FAF7F2 */
      border: 1px var(--color-surface-raised) solid; /* #EDE3D4 */
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;
    }
    
    .c-pantry-item__content {
      flex: 1 1 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: flex-start;
      gap: 2px;
    }
    
    .c-pantry-item__title {
      color: var(--color-text-primary); /* #2E2A24 */
      font-family: var(--font-interface);
      font-size: var(--font-size-body); /* 14px */
      font-weight: var(--font-weight-regular); /* 400 */
      line-height: 22px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    /* Status Chip integration */
    .c-pantry-item__status {
      flex-shrink: 0;
    }
    .c-status-chip {
      padding: 4px 10px;
      border-radius: 8px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      font-family: var(--font-interface);
      font-size: var(--font-size-body-small); /* 12px */
      font-weight: var(--font-weight-medium); /* 500 */
      line-height: var(--line-height-label); /* 16px */
      letter-spacing: var(--letter-spacing-label); /* 0.84px */
      text-transform: uppercase;
    }
    .c-status-chip--out {
      background-color: var(--color-error-subtle); /* #FAE8E8 */
      color: var(--color-error); /* #C45A5A */
    }
  </style>
</head>
<body>

  <div class="showcase-container">
    <h1 class="ty-display">Pantry Item</h1>
    <p class="ty-body">Pantry items combine a selector checkbox, the item description, and an active status badge.</p>

    <div class="showcase-section">
      <span class="state-label">Default State</span>
      <div class="c-pantry-item">
        <div class="c-pantry-item__checkbox"></div>
        <div class="c-pantry-item__content">
          <span class="c-pantry-item__title">Rajma (Red Kidney Beans)</span>
        </div>
        <div class="c-pantry-item__status">
          <div class="c-status-chip c-status-chip--out">OUT</div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
